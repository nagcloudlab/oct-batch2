spring.application.name=npay-server
server.port=8080
# JSON field names in snake_case: balancePaise -> balance_paise
spring.jackson.property-naming-strategy=SNAKE_CASE
# a quiet terminal: just the server's own request lines
spring.main.banner-mode=off
logging.level.root=WARN
# access tokens live one hour in the workshop (refresh is taught in the security step)
npay.access-seconds=3600
# Lab 6: after a payment, send "Payment sent" to the booted iOS Simulator (xcrun simctl push). false = no push
npay.push.simulator=true
